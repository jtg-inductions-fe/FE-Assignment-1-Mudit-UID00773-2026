<!doctype html>
<html lang="en">
    <head>
        <title>Alurabooks</title>
        <link rel="icon" type="image/png" href="/assets/images/Logo.png" />
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="src/styles/main.scss" />
    </head>
    <body>
        <!-- NavBar -->
        <nav class="navbar">
            <div class="navbar__menu-container">
                <button class="navbar__menu-icon-container js-menu-toggle">
                    <i class="fa-solid fa-bars navbar__menu-icon"></i>
                </button>
                <div class="navbar__menu-dropdown u-hidden js-menu-dropdown">
                    <ul class="navbar__menu-dropdown-list">
                        <li>
                            <button class="navbar__menu-dropdown-item">
                                Categories
                            </button>
                        </li>
                        <li>
                            <button class="navbar__menu-dropdown-item">
                                Front-End
                            </button>
                        </li>
                        <li>
                            <button class="navbar__menu-dropdown-item">
                                Infratructure
                            </button>
                        </li>
                        <li>
                            <button class="navbar__menu-dropdown-item">
                                Buisness
                            </button>
                        </li>
                        <li>
                            <button class="navbar__menu-dropdown-item">
                                Programming
                            </button>
                        </li>
                        <li>
                            <button class="navbar__menu-dropdown-item">
                                Design & UX
                            </button>
                        </li>
                    </ul>
                </div>
            </div>
            <div class="navbar__logo-conatiner">
                <img
                    src="/assets/images/Logo.png"
                    alt="AluraBooks"
                    class="navbar__logo-icon"
                />
                <span class="navbar__logo-text">
                    <span class="navbar__logo-text--bold">Alura</span>Books
                </span>
            </div>

            <!-- Desktop icons -->
            <div class="navbar__links-container">
                <div class="navbar__link-item js-link-item">
                    <a href="#">CATEGORIES</a>
                    <div class="navbar__link-dropdown">
                        <ul class="navbar__link-dropdown-list">
                            <button class="navbar__link-dropdown-item">
                                Programming
                            </button>
                            <button class="navbar__link-dropdown-item">
                                Front-End
                            </button>
                            <button class="navbar__link-dropdown-item">
                                Infratructure
                            </button>
                            <button class="navbar__link-dropdown-item">
                                Buisness
                            </button>
                            <button class="navbar__link-dropdown-item">
                                Design & UX
                            </button>
                        </ul>
                    </div>
                </div>
                <div class="navbar__link-item">
                    <a href="#">FAVORITES</a>
                </div>
                <div class="navbar__link-item">
                    <a href="#">MY BOOKSHELF</a>
                </div>
            </div>

            <div class="navbar__options">
                <button class="navbar__option-container">
                    <i class="fa-regular fa-heart navbar__option-icon"></i>
                </button>
                <button class="navbar__option-container">
                    <i class="fa-solid fa-bag-shopping navbar__option-icon"></i>
                    <span class="navbar__option-text">My Bag</span>
                </button>
                <button class="navbar__option-container">
                    <i
                        class="fa-regular fa-circle-user navbar__option-icon"
                    ></i>
                    <span class="navbar__option-text">My Profile</span>
                </button>
            </div>
        </nav>

        <section class="hero-section">
            <h1 class="hero-section__heading">
                Do you already know where to start?
            </h1>
            <p class="hero-section__info">
                Find what you need for your development on our bookshelf!
            </p>

            <div class="hero-section__input-container">
                <input
                    type="text"
                    class="hero-section__input"
                    placeholder="🔍︎    What will your next read be?"
                />
            </div>
        </section>

        <!-- Directly using script of fontawesome -->
        <script
            src="https://kit.fontawesome.com/d0e6bd4543.js"
            crossorigin="anonymous"
        ></script>
        <script type="module" src="./src/script/index.js"></script>
    </body>
</html>
