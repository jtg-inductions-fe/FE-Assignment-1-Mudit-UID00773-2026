<!doctype html>
<html lang="en">
    <head>
        <title>Alurabooks</title>
        <link rel="icon" type="image/png" href="/assets/images/Logo.png" />
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="src/styles/main.scss" />
        <link
            rel="stylesheet"
            href="node_modules/@glidejs/glide/dist/css/glide.core.min.css"
        />
    </head>
    <body>
        <!-- NavBar -->
        <nav class="navbar">
            <div class="navbar__menu-container">
                <button class="navbar__menu-icon-container js-menu-toggle">
                    <i class="fa-solid fa-bars navbar__menu-icon"></i>
                </button>
                <div class="navbar__menu-dropdown u-hidden js-menu-dropdown">
                    <ul class="navbar__menu-dropdown-list">
                        <li>
                            <button class="navbar__menu-dropdown-item">
                                Categories
                            </button>
                        </li>
                        <li>
                            <button class="navbar__menu-dropdown-item">
                                Front-End
                            </button>
                        </li>
                        <li>
                            <button class="navbar__menu-dropdown-item">
                                Infratructure
                            </button>
                        </li>
                        <li>
                            <button class="navbar__menu-dropdown-item">
                                Buisness
                            </button>
                        </li>
                        <li>
                            <button class="navbar__menu-dropdown-item">
                                Programming
                            </button>
                        </li>
                        <li>
                            <button class="navbar__menu-dropdown-item">
                                Design & UX
                            </button>
                        </li>
                    </ul>
                </div>
            </div>
            <div class="navbar__logo-conatiner">
                <img
                    src="/assets/images/Logo.png"
                    alt="AluraBooks"
                    class="navbar__logo-icon"
                />
                <span class="navbar__logo-text">
                    <span class="navbar__logo-text--bold">Alura</span>Books
                </span>
            </div>

            <!-- Desktop icons -->
            <div class="navbar__links-container">
                <div class="navbar__link-item js-link-item">
                    <a href="#">CATEGORIES</a>
                    <ul class="navbar__link-dropdown u-hidden js-link-dropdown">
                        <li>
                            <button class="navbar__link-dropdown-item">
                                Programming
                            </button>
                        </li>
                        <li>
                            <button class="navbar__link-dropdown-item">
                                Front-End
                            </button>
                        </li>
                        <li>
                            <button class="navbar__link-dropdown-item">
                                Infratructure
                            </button>
                        </li>
                        <li>
                            <button class="navbar__link-dropdown-item">
                                Buisness
                            </button>
                        </li>
                        <li>
                            <button class="navbar__link-dropdown-item">
                                Design & UX
                            </button>
                        </li>
                    </ul>
                </div>
                <div class="navbar__link-item">
                    <a href="#">FAVORITES</a>
                </div>
                <div class="navbar__link-item">
                    <a href="#">MY BOOKSHELF</a>
                </div>
            </div>

            <div class="navbar__options">
                <button class="navbar__option-container">
                    <i class="fa-regular fa-heart navbar__option-icon"></i>
                </button>
                <button class="navbar__option-container">
                    <i class="fa-solid fa-bag-shopping navbar__option-icon"></i>
                    <span class="navbar__option-text">My Bag</span>
                </button>
                <button class="navbar__option-container">
                    <i
                        class="fa-regular fa-circle-user navbar__option-icon"
                    ></i>
                    <span class="navbar__option-text">My Profile</span>
                </button>
            </div>
        </nav>

        <main class="hero-section">
            <h1 class="hero-section__heading">
                Do you already know where to start?
            </h1>
            <p class="hero-section__info">
                Find what you need for your development on our bookshelf!
            </p>

            <div class="hero-section__input-container">
                <i
                    class="fa-solid fa-magnifying-glass hero-section__input-icon"
                    aria-hidden="true"
                ></i>
                <input
                    type="text"
                    class="hero-section__input"
                    placeholder="What will your next read be?"
                    aria-label="Search for book to read"
                />
            </div>
        </main>

        <section class="latest-section">
            <div class="latest-section__header">
                <h2>LATEST RELEASE</h2>
            </div>
            <div class="latest-section__container">
                <div class="carousel-container">
                    <div class="glide carousel">
                        <div
                            class="glide__bullets carousel__bullets"
                            data-glide-el="controls[nav]"
                        >
                            <button
                                class="glide__bullet carousel__bullet"
                                data-glide-dir="=0"
                            ></button>
                            <button
                                class="glide__bullet carousel__bullet"
                                data-glide-dir="=1"
                            ></button>
                            <button
                                class="glide__bullet carousel__bullet"
                                data-glide-dir="=2"
                            ></button>
                            <button
                                class="glide__bullet carousel__bullet"
                                data-glide-dir="=3"
                            ></button>
                        </div>

                        <div class="glide__track" data-glide-el="track">
                            <ul class="glide__slides carousel__items">
                                <li class="glide__slide carousel__item">
                                    <img
                                        src="/assets/images/ApacheKafka.png"
                                        alt="image"
                                    />
                                </li>
                                <li class="glide__slide carousel__item">
                                    <img
                                        src="/assets/images/Liderança.png"
                                        alt="image"
                                    />
                                </li>
                                <li class="glide__slide carousel__item">
                                    <img
                                        src="/assets/images/Javascript.png"
                                        alt="image"
                                    />
                                </li>
                                <li class="glide__slide carousel__item">
                                    <img
                                        src="/assets/images/Portugol.png"
                                        alt="image"
                                    />
                                </li>
                            </ul>
                        </div>

                        <div
                            class="glide__arrows carousel__arrows"
                            data-glide-el="controls"
                        >
                            <button
                                class="glide__arrow glide__arrow--left carousel__arrow carousel__arrow--left"
                                data-glide-dir="<"
                            >
                                <p>&lt;</p>
                            </button>
                            <button
                                class="glide__arrow glide__arrow--right carousel__arrow carousel__arrow--right"
                                data-glide-dir=">"
                            >
                                <p>&gt;</p>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="card-container">
                    <div class="card">
                        <div class="card-left">
                            <h3 class="card-left__heading--primary">
                                You might also be interested in...
                            </h3>
                            <h3 class="card-left__heading--secondary">
                                Angular 11 and Firebase
                            </h3>
                            <p class="card-left__info">
                                Building an application integrated with the
                                Google platform.
                            </p>
                            <div class="card-left__icons">
                                <i
                                    class="fa-regular fa-heart card-left__icon"
                                ></i>
                                <i
                                    class="fa-solid fa-bag-shopping card-left__icon"
                                ></i>
                            </div>
                        </div>
                        <div class="card-right">
                            <img
                                src="/assets/images/Perfil-escritora 2.png"
                                alt="image"
                            />
                            <button class="card-right__button">
                                Learn more
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <script src="node_modules/@glidejs/glide/dist/glide.min.js"></script>
        <script
            src="https://kit.fontawesome.com/d0e6bd4543.js"
            crossorigin="anonymous"
        ></script>
        <script>
            new Glide('.glide', {
                type: 'carousel',
                activeNav: 'glide__bullet--active',
                rewind: true,
                startAt: 0,
                perView: 3,
                peek: {
                    before: 0,
                    after: 0,
                },
                gap: 68,
                breakpoints: {
                    1023: {
                        perView: 2,
                        gap: 26,
                        peek: {
                            before: 128,
                            after: 128,
                        },
                    },
                    576: {
                        perView: 1,
                        gap: 26,
                        peek: {
                            before: 128,
                            after: 128,
                        },
                    },
                    427: {
                        perView: 1,
                        gap: 26,
                        peek: {
                            before: 100,
                            after: 100,
                        },
                    },
                },
            }).mount();
        </script>
        <script type="module" src="./src/script/index.js"></script>
    </body>
</html>
